<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="handSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDE82"/>
      <stop offset="60%" stop-color="#FFC83B"/>
      <stop offset="100%" stop-color="#FAAA00"/>
    </linearGradient>
    <linearGradient id="sleeveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="handShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    @keyframes waveHandAnim {
      0% { transform: rotate(0deg); }
      12% { transform: rotate(22deg); }
      24% { transform: rotate(-14deg); }
      36% { transform: rotate(22deg); }
      48% { transform: rotate(-10deg); }
      60% { transform: rotate(18deg); }
      72% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes sparkleFade {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .waving-hand-group {
      transform-origin: 65px 75px;
      animation: waveHandAnim 2.5s ease-in-out infinite;
    }

    .sparkle-1 {
      animation: sparkleFade 2s infinite ease-in-out;
      transform-origin: 20px 25px;
    }
    .sparkle-2 {
      animation: sparkleFade 2s infinite ease-in-out 0.8s;
      transform-origin: 82px 30px;
    }
  </style>

  <!-- Sparkles -->
  <g class="sparkle-1">
    <path d="M 20 18 Q 20 25 13 25 Q 20 25 20 32 Q 20 25 27 25 Q 20 25 20 18" fill="#FDE047"/>
  </g>
  <g class="sparkle-2">
    <path d="M 82 23 Q 82 29 76 29 Q 82 29 82 35 Q 82 29 88 29 Q 82 29 82 23" fill="#38BDF8"/>
  </g>

  <!-- Animated Waving Hand -->
  <g class="waving-hand-group" filter="url(#handShadow)">
    <!-- Sleeve -->
    <path d="M 52 76 L 78 76 L 82 96 L 48 96 Z" fill="url(#sleeveGrad)" rx="3"/>
    
    <!-- Palm and Fingers -->
    <!-- Pinky Finger -->
    <rect x="25" y="44" width="9" height="24" rx="4.5" fill="url(#handSkin)" transform="rotate(-30 25 44)"/>
    <!-- Ring Finger -->
    <rect x="33" y="31" width="9.5" height="32" rx="4.75" fill="url(#handSkin)" transform="rotate(-15 33 31)"/>
    <!-- Middle Finger -->
    <rect x="44" y="24" width="10" height="36" rx="5" fill="url(#handSkin)" transform="rotate(-2 44 24)"/>
    <!-- Index Finger -->
    <rect x="56" y="28" width="9.5" height="33" rx="4.75" fill="url(#handSkin)" transform="rotate(10 56 28)"/>
    <!-- Thumb -->
    <rect x="67" y="47" width="9.5" height="24" rx="4.75" fill="url(#handSkin)" transform="rotate(35 67 47)"/>
    
    <!-- Main Palm Body -->
    <path d="M 36 53 C 33 62 44 75 58 75 C 69 75 73 66 73 54 C 73 50 67 48 60 50 C 52 52 46 48 40 49 C 37 49 36 51 36 53 Z" fill="url(#handSkin)"/>
  </g>
</svg>
